name: Build Custom Debian GNOME ISO (Testing)

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual triggering for testing

permissions:
  contents: write

jobs:
  build-iso:
    name: Build ISO Image
    runs-on: ubuntu-latest
    container:
      image: debian:forky-slim
      options: --privileged  # Required for live-build operations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            curl \
            git \
            ca-certificates \
            sudo \
            fakeroot \
            mtools \
            dosfstools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            isolinux \
            syslinux-efi \
            cpio \
            p7zip-full \
            wget

      - name: Set up build environment
        run: |
          # Create build directory
          mkdir -p /build
          cd /build

          # Copy configuration from repository if it exists
          if [ -d "$GITHUB_WORKSPACE/config" ]; then
            cp -r $GITHUB_WORKSPACE/config /build/
          fi

          # Copy hooks from repository if they exist
          if [ -d "$GITHUB_WORKSPACE/hooks" ]; then
            cp -r $GITHUB_WORKSPACE/hooks /build/config/ 2>/dev/null || :
          fi

          # Copy includes from repository if they exist
          if [ -d "$GITHUB_WORKSPACE/includes.chroot" ]; then
            cp -r $GITHUB_WORKSPACE/includes.chroot /build/config/ 2>/dev/null || :
          fi

      - name: Clean previous build artifacts
        run: |
          cd /build
          lb clean --purge

      - name: Initialize live-build configuration
        run: |
          cd /build

          # Extract version from release tag
          VERSION=${GITHUB_REF_NAME#v}  # Remove 'v' prefix if present
          VERSION=${VERSION:-1.0.0}      # Default if not set

          lb config \
            -a amd64 \
            -d forky \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootloader grub-efi \
            --debian-installer false \
            --distribution forky \
            --iso-application "AEM OS Testing" \
            --iso-publisher "mehmedaltug" \
            --iso-volume "AEM_OS-${VERSION}-TESTING" \
            --memtest none \
            --mode debian \
            --parent-distribution forky \
            --parent-archive-areas "main contrib non-free non-free-firmware" \
            --security true \
            --updates true \
            --cache true \
            --bootappend-live "boot=live components autologin"

      - name: Configure Sid Fallback Repository & Pinning
        run: |
          cd /build
          mkdir -p config/archives

          # Add Sid (unstable) source list for missing packages fallback
          cat > config/archives/sid.list.chroot << 'EOF'
          deb http://deb.debian.org/debian sid main contrib non-free non-free-firmware
          EOF

          # Pin Testing higher so Sid is only used when packages are absent in Testing
          cat > config/archives/sid.pref.chroot << 'EOF'
          Package: *
          Pin: release a=testing
          Pin-Priority: 900

          Package: *
          Pin: release a=unstable
          Pin-Priority: 100
          EOF

      - name: Verify config directory
        run: |
            ls -la /build
            ls -la /build/config/ || echo "config/ directory missing!"

      - name: Create package lists
        run: |
          cd /build

          # Create desktop package list
          mkdir -p config/package-lists
          cat > config/package-lists/desktop.list.chroot << 'EOF'
          # Base system
          task-english
          task-laptop
          alsa-utils
          sudo
          network-manager
          network-manager-applet
          firmware-linux
          firmware-iwlwifi
          firmware-realtek

          # Bootloader dependencies for Calamares
          grub-efi-amd64-bin
          grub-pc-bin
          efibootmgr
          os-prober

          # Minimal GNOME desktop
          gnome-core
          gnome-themes-extra
          gnome-shell-extension-manager
          gnome-tweaks
          gdm3

          # Printing support
          cups
          cups-client
          cups-filters
          system-config-printer

          # Installer
          calamares
          calamares-settings-debian

          # Homebrew dependencies
          build-essential
          curl
          file
          git
          python3
          procps
          EOF

          # Create live package list
          cat > config/package-lists/live.list.chroot << 'EOF'
          live-boot
          live-config
          live-config-systemd
          live-tools
          user-setup
          sudo
          EOF

      - name: Create installation hooks
        run: |
          cd /build
          mkdir -p config/hooks/normal

          # Homebrew & Third-Party Repositories installation hook
          cat > config/hooks/normal/1000-install-homebrew.chroot << 'EOF'
          #!/bin/bash

          # Install dependencies
          apt-get install -y build-essential curl file git procps file-roller wget make gpg

          # Post installation actions - Set file-roller as default
          grep '^MimeType=' /usr/share/applications/org.gnome.Nautilus.desktop | cut -d'=' -f2 | tr ';' $'\n' | grep -v 'inode/directory' | xargs xdg-mime default org.gnome.FileRoller.desktop

          # Add Mozilla Firefox official APT repository
          mkdir -p -m 0755 /etc/apt/keyrings
          wget -q https://packages.mozilla.org/apt/repo-signing-key.gpg -O- | tee /etc/apt/keyrings/packages.mozilla.org.asc > /dev/null
          gpg -n -q --import --import-options import-show /etc/apt/keyrings/packages.mozilla.org.asc | awk '/pub/{getline; gsub(/^ +| +$/,""); print "\n"$0"\n"}'
          echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" | tee /etc/apt/sources.list.d/mozilla.list > /dev/null
          echo '
          Package: *
          Pin: origin packages.mozilla.org
          Pin-Priority: 1000
          ' | tee /etc/apt/preferences.d/mozilla

          # Add official GitHub CLI (gh) repository
          wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null

          # Update APT and install Firefox & GitHub CLI
          apt-get update && apt-get install -y firefox gh

          # Remove unwanted packages
          apt-get remove --purge -y firefox-esr gnome-contacts gnome-tour gnome-maps malcontent plymouth gnome-software*
          apt-get autoremove -y

          # Remove unwanted service(s)
          systemctl disable NetworkManager-wait-online.service

          # Remove unwanted desktop entry(s)
          rm -f /usr/share/applications/kdesystemsettings.desktop
          rm -f /usr/share/applications/yelp.desktop

          # Create the linuxbrew directory
          mkdir -p /home/linuxbrew/.linuxbrew/Homebrew
          mkdir -p /home/linuxbrew/.linuxbrew/bin

          # Clone Homebrew manually (bypassing the root-check installer)
          git clone https://github.com/Homebrew/brew /home/linuxbrew/.linuxbrew/Homebrew

          # Symlink the executable
          ln -s /home/linuxbrew/.linuxbrew/Homebrew/bin/brew /home/linuxbrew/.linuxbrew/bin/brew

          # Open permissions so ANY user can use it
          chmod -R a+rwx /home/linuxbrew/.linuxbrew

          # Create the linuxbrew user
          useradd -m -s /bin/bash linuxbrew
          chown -R linuxbrew:linuxbrew /home/linuxbrew

          # Auto-install Homebrew packages
          su - linuxbrew -c "/home/linuxbrew/.linuxbrew/bin/brew install node npm"

          # Clean up the Homebrew cache
          su - linuxbrew -c "/home/linuxbrew/.linuxbrew/bin/brew cleanup --prune=all"

          # Restore permissions
          chown -R root:root /home/linuxbrew
          chmod -R a+rwx /home/linuxbrew/.linuxbrew

          # Remove linuxbrew user
          userdel linuxbrew

          # Set up Homebrew in system profile
          cat > /etc/profile.d/homebrew.sh << 'BREW'
          #!/bin/bash
          if [ -d /home/linuxbrew/.linuxbrew ]; then
              eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          BREW
          chmod +x /etc/profile.d/homebrew.sh

          # Add to bash.bashrc for interactive shells
          cat >> /etc/bash.bashrc << 'BASHRC'
          # Homebrew
          if [ -d /home/linuxbrew/.linuxbrew ] && [ -n "$BASH_VERSION" ]; then
              eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          BASHRC
          EOF
          chmod +x config/hooks/normal/1000-install-homebrew.chroot

          # Skip GNOME initial setup
          cat > config/hooks/normal/4000-skip-gnome-initial-setup.chroot << 'EOF'
          #!/bin/bash
          mkdir -p /etc/skel/.config
          echo "yes" > /etc/skel/.config/gnome-initial-setup-done
          EOF
          chmod +x config/hooks/normal/4000-skip-gnome-initial-setup.chroot

          # Final cleanup hook
          cat > config/hooks/normal/9999-final-cleanup.chroot << 'EOF'
          #!/bin/bash
          apt-get clean
          apt-get autoremove --purge -y
          rm -rf /var/lib/apt/lists/*
          find /usr/share/locale -mindepth 1 -maxdepth 1 ! -name 'en*' -exec rm -rf {} +
          EOF
          chmod +x config/hooks/normal/9999-final-cleanup.chroot

      - name: Create Calamares installer configuration
        run: |
          cd /build
          mkdir -p config/includes.chroot/etc/calamares/modules

          # Create welcome module
          cat > config/includes.chroot/etc/calamares/modules/welcome.conf << 'EOF'
          ---
          welcomeStyle: SideBySide
          showSupportUrl: false
          showKnownIssuesUrl: false
          showReleaseNotesUrl: false
          requirements:
            required:
              - storage
              - ram
              - root
              - screen
            requiredStorage: 5.0
            requiredRam: 1.0
            check:
              - storage
              - ram
              - root
              - screen
          EOF

          # Create users module
          cat > config/includes.chroot/etc/calamares/modules/users.conf << 'EOF'
          ---
          defaultGroups:
            - audio
            - cdrom
            - dip
            - floppy
            - netdev
            - plugdev
            - sudo
            - video
          autologinGroup: autologin
          doAutologin: false
          sudoersGroup: sudo
          setRootPassword: true
          doReusePassword: true
          passwordRequirements:
            minLength: 1
            maxLength: 0
            requireNonEmpty: true
          userShell: /bin/bash
          EOF

          # Create partition module
          cat > config/includes.chroot/etc/calamares/modules/partition.conf << 'EOF'
          ---
          defaultFileSystemType: ext4
          alwaysShowPartitionLabels: true
          allowManualPartitioning: true
          drawNestedPartitions: true
          enableEncryption: true
          enableLuksAutomount: true
          eraseFsFile: true
          EOF

          # Create main Calamares settings
          cat > config/includes.chroot/etc/calamares/settings.conf << 'EOF'
          ---
          modules-search: [ local ]

          sequence:
            - show:
              - welcome
              - locale
              - keyboard
              - users
              - partition
              - summary
            - exec:
              - partition
              - mount
              - unpackfs
              - machineid
              - fstab
              - locale
              - keyboard
              - localecfg
              - hwclock
              - users
              - displaymanager
              - networkcfg
              - initramfs
              - grubcfg
              - bootloader
              - packages
              - shellprocess
              - umount
            - show:
              - finished

          branding: aem-os-testing
          prompt-install: true
          dont-chroot: false
          oem-setup: false
          disable-cancel: false
          quit-at-end: false
          EOF

          # Create unpackfs module
          cat > config/includes.chroot/etc/calamares/modules/unpackfs.conf << 'EOF'
          ---
          unpack:
            - source: /run/live/medium/live/filesystem.squashfs
              sourcefs: squashfs
              destination: ""
          EOF

          # Create packages module
          cat > config/includes.chroot/etc/calamares/modules/packages.conf << 'EOF'
          ---
          backend: apt
          operations:
            - remove:
                - live-boot
                - live-config
                - live-config-systemd
                - live-tools
                - calamares
                - calamares-settings-debian
          EOF

          # Create locale module
          cat > config/includes.chroot/etc/calamares/modules/locale.conf << 'EOF'
          ---
          region: "America"
          zone: "New_York"
          useSystemTimezone: true
          EOF

          # Create keyboard module
          cat > config/includes.chroot/etc/calamares/modules/keyboard.conf << 'EOF'
          ---
          xkbmodel: "pc105"
          EOF

          # Create shellprocess module
          cat > config/includes.chroot/etc/calamares/modules/shellprocess.conf << 'EOF'
          ---
          dontChroot: false
          script:
              - command: "rm -f /etc/skel/Desktop/install-system.desktop"
              - command: "rm -f /home/*/Desktop/install-system.desktop"
          EOF

      - name: Create branding
        run: |
          cd /build
          mkdir -p config/includes.chroot/usr/share/calamares/branding/aem-os-testing

          VERSION=${GITHUB_REF_NAME#v}
          VERSION=${VERSION:-1.0.0}

          mkdir -p config/includes.chroot/usr/lib
          cat > config/includes.chroot/usr/lib/os-release << EOF
          PRETTY_NAME="AEM OS ${VERSION}-testing"
          NAME="AEM OS Testing"
          VERSION_ID="${VERSION}-testing"
          VERSION="${VERSION}-testing"
          VERSION_CODENAME="forky"
          ID=aemos-testing
          ID_LIKE=debian
          EOF

          cp config/includes.chroot/usr/lib/os-release config/includes.chroot/etc/os-release

          cat > config/includes.chroot/etc/issue << EOF
          AEM OS ${VERSION}-testing \n \l

          EOF

          cat > config/includes.chroot/etc/issue.net << EOF
          AEM OS ${VERSION}-testing
          EOF

          cat > config/includes.chroot/usr/share/calamares/branding/aem-os-testing/branding.desc << EOF
          componentName:  aem-os-testing

          strings:
              productName:         AEM OS Testing
              shortProductName:    AEMOS-Testing
              version:             ${VERSION}-testing
              shortVersion:        ${VERSION}-testing
              versionedName:       AEM OS ${VERSION}-testing
              shortVersionedName:  AEMOS ${VERSION}-testing
              bootloaderEntryName: AEM-OS-Testing
              welcomeMessage:      "Welcome to the AEM OS Testing installer."
              aboutMessage:        "Thanks for choosing AEM OS Testing.\n\nThis installer will guide you through the setup process."

          images:
              productLogo:         ""
              productIcon:         ""
              productWelcome:      ""

          slideshow:               []

          style:
              sidebarBackground:   "#2c3e50"
              sidebarText:         "#ffffff"
              sidebarBackgroundCurrent: "#e67e22"
          EOF

      - name: Create desktop shortcut for installer
        run: |
          cd /build
          mkdir -p config/includes.chroot/etc/skel/Desktop

          cat > config/includes.chroot/etc/skel/Desktop/install-system.desktop << 'EOF'
          [Desktop Entry]
          Name=Install System
          Comment=Install this distribution to your hard disk
          Exec=sudo -E calamares
          Icon=system-os-install
          Terminal=false
          Type=Application
          Categories=System;
          StartupNotify=true
          EOF

          mkdir -p config/hooks/normal
          cat > config/hooks/normal/5000-desktop-shortcuts.chroot << 'EOF'
          #!/bin/bash
          if [ -f /etc/skel/Desktop/install-system.desktop ]; then
              chmod +x /etc/skel/Desktop/install-system.desktop
          fi
          EOF
          chmod +x config/hooks/normal/5000-desktop-shortcuts.chroot

      - name: Build the ISO
        run: |
          cd /build
          export MKSQUASHFS_OPTIONS="-comp xz -b 1M -Xdict-size 100%"

          lb build 2>&1 | tee build.log

          if [ ! -f live-image-amd64.hybrid.iso ]; then
              echo "ISO build failed!"
              exit 1
          fi

      - name: Prepare ISO for artifact
        run: |
          cd /build
          VERSION=${GITHUB_REF_NAME#v}
          VERSION=${VERSION:-latest}

          mv live-image-amd64.hybrid.iso "aem-os-${VERSION}-gnome-testing.iso"
          7z a -t7z -m0=lzma2 -mx=9 -md=128m -mfb=256 -v2000m "aem-os-${VERSION}-gnome-testing.7z" "aem-os-${VERSION}-gnome-testing.iso"
          sha256sum "aem-os-${VERSION}-gnome-testing.iso" > "aem-os-${VERSION}-gnome-testing.iso.sha256"
          rm -f "aem-os-${VERSION}-gnome-testing.iso"

      - name: Upload Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /build/aem-os-*-gnome-testing.7z*
            /build/aem-os-*-gnome-testing.iso.sha256

      - name: Upload artifacts (for workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: aem-os-gnome-testing-iso
          path: |
            /build/aem-os-*-gnome-testing.7z*
            /build/aem-os-*-gnome-testing.iso.sha256
          retention-days: 30
